services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
  server:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      CLIENT_URL: http://localhost:5173
      MONGODB_URI: mongodb://mongo:27017/istomin_blog
      JWT_SECRET: change-this-before-deploying-to-a-long-random-secret
      COOKIE_NAME: istomin_session
      COOKIE_MAX_AGE_DAYS: 7
    ports: ["4000:4000"]
    depends_on:
      mongo:
        condition: service_healthy
  client:
    build: ./client
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports: ["5173:5173"]
    depends_on: [server]
volumes:
  mongo_data:
